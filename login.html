  <script>
  /* ER_RETRY_V1 —— 资源加载兜底（P0-4：平台偶发对已存在的文件回 404）
     ① 为什么内联、不放进独立 .js：兜底脚本自己也会被 404，独立文件等于没兜底。
     ② 为什么串行排队：login.js 依赖 common.js 的 escapeHTML、page-loader.js 的 PageLoader，
        并行重试会打乱执行顺序，比不兜底更糟。
     ③ 为什么最多 2 次：再失败就是真没了，继续重试只是把抖动放大成刷请求。
     ④ 只兜 <script> 与 <link rel=stylesheet>；图片裂了不影响功能，不重试。
     ⑤ 位置必须在 <meta charset> 之后：本片段约 2.2KB，放前面会把字符集声明顶出前 1024 字节，
        浏览器改用别的编码 → 中文乱码。 */
  (function () {
    var MAX = 2, queue = [], running = false;
    function urlOf(el) { return el.tagName === 'LINK' ? el.href : el.src; }
    function enqueue(el) {
      var n = +(el.getAttribute('data-er-retry') || 0);
      if (n >= MAX) return;
      el.setAttribute('data-er-retry', n + 1);
      if (queue.indexOf(el) < 0) queue.push(el);
      drain();
    }
    function drain() {
      if (running || !queue.length) return;
      running = true;
      var el = queue.shift();
      var n = +el.getAttribute('data-er-retry');
      var base = urlOf(el).split(/[?&]er_retry=/)[0].replace(/[?&]$/, '');
      var sep = base.indexOf('?') > -1 ? '&' : '?';
      var node;
      if (el.tagName === 'LINK') {
        node = document.createElement('link');
        node.rel = 'stylesheet';
        node.href = base + sep + 'er_retry=' + n + '_' + Date.now();
      } else {
        node = document.createElement('script');
        node.src = base + sep + 'er_retry=' + n + '_' + Date.now();
        node.async = false;
      }
      node.setAttribute('data-er-generated', '1');
      node.onload = function () { running = false; drain(); };
      node.onerror = function () { running = false; enqueue(el); drain(); };
      (document.head || document.documentElement).appendChild(node);
    }
    document.addEventListener('error', function (e) {
      var t = e.target;
      if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
      if (!urlOf(t)) return;
      if (t.hasAttribute('data-er-generated')) return;
      enqueue(t);
    }, true);
  })();
  </script>

      <header class="site-header">
        <h1>登录<span class="auth-h1-en">Sign in</span></h1>

      <div class="auth-wrap">
        <!-- Tab：两个按钮换着切面板，地址栏不动（注册和登录没隔一条路那么远） -->
        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
          <button type="button" class="auth-tab" id="tab-login"
                  data-tab="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" id="tab-register"
                  data-tab="register" role="tab" aria-selected="false">注册</button>
        </div>

        <!-- 状态位：成功 / 失败的话全写在这一个地方。
             role="alert" 让读屏软件主动播报，不用用户自己找到它 -->
        <p id="auth-status" class="form-status" role="alert"></p>

        <!-- 登录表单 -->
        <form id="form-login" class="auth-card item" novalidate>
          <label class="auth-label">
            <span>用户名（3~20 位，字母 / 数字 / 下划线）</span>
            <input class="auth-field" type="text" name="username"
                   autocomplete="username" maxlength="20" required>
          </label>
          <label class="auth-label">
            <span>密码（至少 8 位）</span>
            <input class="auth-field" type="password" name="password"
                   autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn acct-btn">登录</button>
        </form>

        <!-- 注册表单（默认藏起来，点上面的 tab 切过来） -->
        <form id="form-register" class="auth-card item" hidden novalidate>
          <label class="auth-label">
            <span>用户名（3~20 位，字母 / 数字 / 下划线）</span>
            <input class="auth-field" type="text" name="username"
                   autocomplete="username" maxlength="20" required>
          </label>
          <label class="auth-label">
            <span>密码（至少 8 位）</span>
            <input class="auth-field" type="password" name="password"
                   autocomplete="new-password" required>
          </label>
          <label class="auth-label">
            <span>邀请码（向开发者获取，没有邀请码无法注册）</span>
            <input class="auth-field" type="text" name="inviteCode"
                   maxlength="32" autocomplete="off" required>
          </label>
          <button type="submit" class="btn acct-btn">注册</button>
        </form>
      </div>
