<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ 跨页过渡的 opt-in，【必须】留在这里 —— 站内每个页面各声明一份才生效。
       为什么不能挪进 style.css：见 index.html 里的同名注释。 -->
  <style>@view-transition { navigation: auto; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 星禾星穗</title>
    <script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/css/style.css">
  <!-- 外壳层。⚠️ 必须排在 style.css 之后，详见 app-shell.css 开头 -->
  <link rel="stylesheet" href="assets/css/app-shell.css">
  <link rel="stylesheet" href="assets/css/page-loader.css">
</head>
<body class="app page-auth">
  <header class="appbar">
    <button type="button" class="iconbtn appbar__menu" id="btn-left"
            aria-expanded="false" aria-controls="panel-left" aria-label="打开板块导航">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" aria-hidden="true"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg>
    </button>

    <a class="appbar__brand" href="index.html">
      <img class="brand-logo" src="assets/img/logo.png" alt="" width="30" height="30">
      <span class="brand-name" role="img" aria-label="星禾星穗">
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
      </span>
    </a>

    <span class="appbar__spacer"></span>

    <!-- ⚠️ 头像字不写死：这个位置由 app-shell.js 的 paintAvatar() 按登录态填
         （登录 = 用户名首字；未登录 = 小人图标）。见斌哥 2026-10-13 的指示。 -->
    <button type="button" class="avatarbtn" id="btn-right"
            aria-expanded="false" aria-controls="panel-right" aria-label="打开个人账号"></button>
  </header>

  <div class="shell">
    <!-- 左栏与其它页一模一样；当前页是登录，不属于任何板块，所以没有 aria-current -->
    <aside class="side side--left" id="panel-left" aria-label="板块导航">
      <nav class="sidenav">
        <a class="sidenav__item" href="index.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 6.6v13"/>
            <path d="M12 6.6C10.6 5.4 8.7 4.6 6.2 4.6H3.6v13h2.6c2.5 0 4.4.8 5.8 2"/>
            <path d="M12 6.6c1.4-1.2 3.3-2 5.8-2h2.6v13h-2.6c-2.5 0-4.4.8-5.8 2"/>
          </svg>
          文本跟读
        </a>

        <a class="sidenav__item" href="vocab.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3.5" y="8.5" width="13" height="11" rx="2.4"/>
            <path d="M7.5 8.5V6.6A2.6 2.6 0 0 1 10.1 4h8.5A2.6 2.6 0 0 1 21.2 6.6v8.5a2.6 2.6 0 0 1-2.6 2.6h-1.9"/>
          </svg>
          词汇速记
        </a>

        <a class="sidenav__item" href="writing.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.6 3.5H7.2A2.2 2.2 0 0 0 5 5.7v12.6a2.2 2.2 0 0 0 2.2 2.2h9.6a2.2 2.2 0 0 0 2.2-2.2V8.6l-5.4-5.1Z"/>
            <path d="M13.4 3.7v5.2h5.4"/>
          </svg>
          free talk练习
        </a>
      </nav>

    </aside>

    <main class="appmain">
      <header class="site-header">
        <h1>登录<span class="auth-h1-en">Sign in</span></h1>
      </header>

      <div class="auth-wrap">
        <!-- Tab：两个按钮换着切面板，地址栏不动（注册和登录没隔一条路那么远） -->
        <div class="auth-tabs" role="tablist" aria-label="登录或注册">
          <button type="button" class="auth-tab" id="tab-login"
                  data-tab="login" role="tab" aria-selected="true">登录</button>
          <button type="button" class="auth-tab" id="tab-register"
                  data-tab="register" role="tab" aria-selected="false">注册</button>
        </div>

        <!-- 状态位：成功 / 失败的话全写在这一个地方。
             role="alert" 让读屏软件主动播报，不用用户自己找到它 -->
        <p id="auth-status" class="form-status" role="alert"></p>

        <!-- 登录表单 -->
        <form id="form-login" class="auth-card item" novalidate>
          <label class="auth-label">
            <span>用户名（3~20 位，字母 / 数字 / 下划线）</span>
            <input class="auth-field" type="text" name="username"
                   autocomplete="username" maxlength="20" required>
          </label>
          <label class="auth-label">
            <span>密码（至少 8 位）</span>
            <input class="auth-field" type="password" name="password"
                   autocomplete="current-password" required>
          </label>
          <button type="submit" class="btn acct-btn">登录</button>
        </form>

        <!-- 注册表单（默认藏起来，点上面的 tab 切过来） -->
        <form id="form-register" class="auth-card item" hidden novalidate>
          <label class="auth-label">
            <span>用户名（3~20 位，字母 / 数字 / 下划线）</span>
            <input class="auth-field" type="text" name="username"
                   autocomplete="username" maxlength="20" required>
          </label>
          <label class="auth-label">
            <span>密码（至少 8 位）</span>
            <input class="auth-field" type="password" name="password"
                   autocomplete="new-password" required>
          </label>
          <label class="auth-label">
            <span>邀请码（向开发者获取，没有邀请码无法注册）</span>
            <input class="auth-field" type="text" name="inviteCode"
                   maxlength="32" autocomplete="off" required>
          </label>
          <button type="submit" class="btn acct-btn">注册</button>
        </form>
      </div>
    </main>

    <aside class="side side--right" id="panel-right" aria-label="个人账号"></aside>
  </div>

  <div class="scrim" id="scrim" aria-hidden="true"></div>

  <!-- ⚠️ 顺序不能动：common.js（工具）→ app-shell.js（外壳 + 登录态）→ login.js（本页表单） -->
  <script src="assets/js/common.js"></script>
  <script src="assets/js/page-loader.js"></script>
  <script src="assets/js/app-shell.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
