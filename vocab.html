<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ 跨页过渡的 opt-in，【必须】留在这里 —— 站内每个页面各声明一份才生效。
       为什么不能挪进 style.css：见 index.html 里的同名注释。 -->
  <style>@view-transition { navigation: auto; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词汇速记 · 英语学习工具</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-list">
  <header class="site-header">
    <a class="back-link" href="index.html">&larr; 返回首页</a>
    <h1>词汇速记</h1>
  </header>

  <main>
    <!-- 视图间平级切换（Day 13）：三个内页互相直达，不必先绕回首页。
         每一项都挂 class="btn item" —— 药丸形与那身皮直接复用现成组件。
         自己是当前页，所以这一项带 aria-current="page" -->
    <nav class="view-nav" aria-label="视图切换">
      <a class="btn item" href="reader.html">文本跟读</a>
      <a class="btn item" href="vocab.html" aria-current="page">词汇速记</a>
      <a class="btn item" href="writing.html">作文模板</a>
    </nav>

    <!-- 状态位：加载中 / 没有结果 / 读取失败＋重试，都写在这一个地方。
         role="status" 是给读屏软件的：内容一变它就会念出来，不用用户自己去发现。
         加载成功时它是空的，不占版面 -->
    <div id="list-status" role="status"></div>

    <!-- 列表由 assets/js/list-page.js 按下面三个 data-* 渲染。
         以后再添一个列表页，照抄这一个 <ul>、改三个属性即可 -->

    <!-- ⚠️ Day 20：data-list-url 从仓库里的 data/words.json 换成【后端接口的完整地址】。
         为什么写完整地址、不写 /api/words 这种相对路径：
           页面挂在静态托管域名（…tcloudbaseapp.com）上，接口在云函数域名
           （…ap-shanghai.app.tcloudbase.com）上 —— 两个域名不一样，
           写相对路径浏览器会去静态站找 /api/words，那边根本没这个路径，必 404。
         为什么只改这一行就够：
           GET /api/words 返回的形状（{ words: [{ id, title, desc, tag }] }）与
           data/words.json 完全一致 —— 所以下面 list-page.js 的渲染逻辑一行都不用动。
         地址里不含任何密钥（只是个公开 URL）；能读写数据库的那把 Key 只在云函数的环境变量里。 -->
    <ul class="list" id="list"
        data-list-url="https://echoread-d0g1b2ez6a369d11e-1502538433.ap-shanghai.app.tcloudbase.com/api/words"
        data-list-key="words"
        data-list-name="词表"></ul>
  </main>

  <script src="assets/js/common.js"></script>
  <script src="assets/js/list-page.js"></script>
</body>
</html>
