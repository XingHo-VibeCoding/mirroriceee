<!DOCTYPE html>

<head>
<meta charset="utf-8">
  <script>
  /* ER_RETRY_V1 —— 资源加载兜底（P0-4：平台偶发对已存在的文件回 404）
     ① 为什么内联、不放进独立 .js：兜底脚本自己也会被 404，独立文件等于没兜底。
     ② 为什么串行排队：login.js 依赖 common.js 的 escapeHTML、page-loader.js 的 PageLoader，
        并行重试会打乱执行顺序，比不兜底更糟。
     ③ 为什么最多 2 次：再失败就是真没了，继续重试只是把抖动放大成刷请求。
     ④ 只兜 <script> 与 <link rel=stylesheet>；图片裂了不影响功能，不重试。
     ⑤ 位置必须在 <meta charset> 之后：本片段约 2.2KB，放前面会把字符集声明顶出前 1024 字节，
        浏览器改用别的编码 → 中文乱码。 */
  (function () {
    var MAX = 2, queue = [], running = false;
    function urlOf(el) { return el.tagName === 'LINK' ? el.href : el.src; }
    function enqueue(el) {
      var n = +(el.getAttribute('data-er-retry') || 0);
      if (n >= MAX) return;
      el.setAttribute('data-er-retry', n + 1);
      if (queue.indexOf(el) < 0) queue.push(el);
      drain();
    }
    function drain() {
      if (running || !queue.length) return;
      running = true;
      var el = queue.shift();
      var n = +el.getAttribute('data-er-retry');
      var base = urlOf(el).split(/[?&]er_retry=/)[0].replace(/[?&]$/, '');
      var sep = base.indexOf('?') > -1 ? '&' : '?';
      var node;
      if (el.tagName === 'LINK') {
        node = document.createElement('link');
        node.rel = 'stylesheet';
        node.href = base + sep + 'er_retry=' + n + '_' + Date.now();
      } else {
        node = document.createElement('script');
        node.src = base + sep + 'er_retry=' + n + '_' + Date.now();
        node.async = false;
      }
      node.setAttribute('data-er-generated', '1');
      node.onload = function () { running = false; drain(); };
      node.onerror = function () { running = false; enqueue(el); drain(); };
      (document.head || document.documentElement).appendChild(node);
    }
    document.addEventListener('error', function (e) {
      var t = e.target;
      if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
      if (!urlOf(t)) return;
      if (t.hasAttribute('data-er-generated')) return;
      enqueue(t);
    }, true);
  })();
  </script>

<script>
/* 抢在样式生效之前把主题贴到 <html> 上（浅色 / 深色 / 跟随系统 三态），
   晚一步用暗色的人每次进来都会先白闪一下。
   ⚠️ 游戏页是独立页面，不引 assets/js/theme.js，所以这段判定要自带一份；
      存储键与主应用一致（er_theme），旧键 er_games_theme 仍读一次做迁移。 */
(function () {
  var mode = 'light';
  try {
    var v = localStorage.getItem('er_theme') || localStorage.getItem('er_games_theme');
    if (v === 'light' || v === 'dark' || v === 'system') mode = v;
  } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function apply() {
    var dark = mode === 'dark' || (mode === 'system' && mq && mq.matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  }
  apply();
  /* 配色（Day 32）：与主界面共用 er_tint，缺省冷白。
     必须在样式生效前贴好，否则暖白用户会先看到一眼冷白再跳。
     ⚠️ 只认 'warm' 这一个显式值，其余一律冷白 —— 和 assets/js/theme.js 的 readTint() 同一套规矩。 */
  try {
    var tint = localStorage.getItem('er_tint');
    document.documentElement.setAttribute('data-tint', tint === 'warm' ? 'warm' : 'cool');
  } catch (e) {
    document.documentElement.setAttribute('data-tint', 'cool');
  }
  /* 选了「跟随系统」的话，系统配色变了要立刻跟上 */
  if (mq && mode === 'system') {
    var on = function () { apply(); };
    if (mq.addEventListener) mq.addEventListener('change', on);
    else if (mq.addListener) mq.addListener(on);
  }
})();
</script>

<script>
/* 兜底词表：只有在 dicts.js 和 words.js 都读不到时才用，正常情况请忽略它 */
const FALLBACK_WORDS = [
  {en:'resilient', zh:'坚韧的；有弹性的',   ph:'/r\u026a\u02c8z\u026ali\u0259nt/'},
  {en:'courage',   zh:'勇气',              ph:'/\u02c8k\u028cr\u026ad\u0292/'},
  {en:'hesitate',  zh:'犹豫，踌躇',         ph:'/\u02c8hez\u026ate\u026at/'},
  {en:'generous',  zh:'慷慨的，大方的',     ph:'/\u02c8d\u0292en\u0259r\u0259s/'},
  {en:'ambiguous', zh:'模棱两可的',         ph:'/\u00e6m\u02c8b\u026a\u0261ju\u0259s/'},
  {en:'vague',     zh:'含糊不清的',         ph:'/ve\u026a\u0261/'},
  {en:'persist',   zh:'坚持，持续',         ph:'/p\u0259\u02c8s\u026ast/'},
  {en:'reluctant', zh:'不情愿的',           ph:'/r\u026a\u02c8l\u028ckt\u0259nt/'},
  {en:'diligent',  zh:'勤勉的',             ph:'/\u02c8d\u026al\u026ad\u0292\u0259nt/'},
  {en:'fragile',   zh:'易碎的，脆弱的',     ph:'/\u02c8fr\u00e6d\u0292a\u026al/'},
  {en:'genuine',   zh:'真正的，真诚的',     ph:'/\u02c8d\u0292enju\u026an/'},
  {en:'abundant',  zh:'丰富的，充裕的',     ph:'/\u0259\u02c8b\u028cnd\u0259nt/'},
  {en:'tolerate',  zh:'容忍，忍受',         ph:'/\u02c8t\u0252l\u0259re\u026at/'},
  {en:'accurate',  zh:'准确的',             ph:'/\u02c8\u00e6kj\u0259r\u0259t/'},
  {en:'sincere',   zh:'真诚的',             ph:'/s\u026an\u02c8s\u026a\u0259/'},
  {en:'obstacle',  zh:'障碍，阻碍',         ph:'/\u02c8\u0252bst\u0259kl/'},
  {en:'thrive',    zh:'茁壮成长，兴旺',     ph:'/\u03b8ra\u026av/'},
  {en:'frequent',  zh:'频繁的',             ph:'/\u02c8fri\u02d0kw\u0259nt/'},
  {en:'modest',    zh:'谦虚的；适度的',     ph:'/\u02c8m\u0252d\u026ast/'},
  {en:'anxious',   zh:'焦虑的；渴望的',     ph:'/\u02c8\u00e6\u014bk\u0283\u0259s/'}
];

/* 优先读外部词库 words.js；读不到才回退到上面的兜底词表。
   轨道宽度有限，过长的词块会挤出屏幕，所以卡在 12 个字母以内。 */
const WORDS = ((window.PICKED_WORDS && window.PICKED_WORDS.length) ? window.PICKED_WORDS : FALLBACK_WORDS)
  .filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3 && w.en.length <= 12);

const $ = id => document.getElementById(id);
const track = $('track');

let pills = [], playing = false, roundActive = false;
let score = 0, combo = 0, bestCombo = 0, lives = 3, rounds = 0, speed = 70;
let rafId = 0, lastT = 0;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 干扰词块优先挑长度接近的，否则一眼就能靠长短认出目标 */
function pickDistractors(target, n){
  const near = WORDS.filter(x => x.en !== target.en && Math.abs(x.en.length - target.en.length) <= 3);
  const pool = near.length >= n ? near : WORDS.filter(x => x.en !== target.en);
  return shuffle(pool).slice(0, n);
}

function renderLives(){
  const box = $('lives');
  box.innerHTML = '';
  for (let i = 0; i < 3; i++){
    const d = document.createElement('span');
    d.className = 'life' + (i < lives ? '' : ' gone');
    box.appendChild(d);
  }
}

function updateHud(){
  $('score').textContent = score;
  $('spd').textContent = (speed / 70).toFixed(1) + '\u00d7';
  renderLives();
}

function showToast(text, color){
  const t = $('toast');
  t.textContent = text;
  t.style.color = color || 'var(--tx)';
  t.classList.add('show');
  clearTimeout(showToast.tid);
  showToast.tid = setTimeout(() => t.classList.remove('show'), 850);
}

function clearPills(fade){
  const old = pills;
  pills = [];
  for (const p of old){
    if (!p.alive) continue;
    p.alive = false;
    if (fade){
      p.el.style.transition = 'opacity .26s';
      p.el.style.opacity = '0';
      setTimeout(() => p.el.remove(), 280);
    } else {
      p.el.remove();
    }
  }
}

function spawnRound(){
  if (!playing) return;
  clearPills(true);
  roundActive = true;
  rounds++;
  speed = Math.min(70 + rounds * 5, 165);
  updateHud();

  const target = shuffle(WORDS)[0];
  const distractors = pickDistractors(target, 3);
  const items = shuffle([{ w: target, correct: true }]
    .concat(distractors.map(w => ({ w: w, correct: false }))));

  $('target').textContent = '当前目标：点中「' + target.zh + '」';

  const W = track.clientWidth;
  const laneW = W / 3;
  /* 同一道里第几颗（0 起）。4 颗词挤 3 道，必有一道叠两颗——
     不拉开纵距的话两颗同起点同速，全程贴死重合（斌哥截图指认的 bug） */
  const laneStack = {};

  items.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'pill';
    el.textContent = it.w.en;
    el.style.transform = 'translate(-9999px,0)';
    track.appendChild(el);

    const pw = el.offsetWidth, phh = el.offsetHeight;
    const lane = i % 3;
    const stack = laneStack[lane] || 0;
    laneStack[lane] = stack + 1;
    const x = lane * laneW + Math.max(6, Math.round((laneW - pw) / 2));
    /* 同道第 2 颗再往上挪一整个身位 + 64px 间隙；两边同速下落，间距全程不变 */
    const y = -phh - 12 - stack * (phh + 64);
    const p = {
      el: el, x: x, y: y,
      delay: stack === 0 ? Math.random() * 1.0 : Math.random() * 0.4 + 0.6,
      correct: it.correct, alive: true, word: it.w
    };
    el.style.transform = 'translate(' + x + 'px,' + p.y + 'px)';
    el.addEventListener('pointerdown', ev => { ev.preventDefault(); hit(p); });
    pills.push(p);
  });
}

function hit(p){
  if (!playing || !p.alive || !roundActive) return;

  if (p.correct){
    combo++;
    bestCombo = Math.max(bestCombo, combo);
    const gain = 100 + combo * 10;
    score += gain;
    p.el.classList.add('ok');
    updateHud();
    showToast('+ ' + gain + '   连击 \u00d7' + combo, 'var(--ok-soft-tx)');
    roundActive = false;
    clearPills(true);
    planNext(640);
  } else {
    combo = 0;
    lives--;
    p.alive = false;
    p.el.classList.add('bad');
    setTimeout(() => p.el.remove(), 300);
    updateHud();
    showToast('点错了', 'var(--bad-tx)');
    if (lives <= 0){ roundActive = false; gameOver(); }
  }
}

function missTarget(){
  if (!roundActive) return;
  roundActive = false;
  combo = 0;
  lives--;
  updateHud();
  showToast('漏掉了', 'var(--warn)');
  planNext(560);
}

function planNext(ms){
  if (lives <= 0){ gameOver(); return; }
  setTimeout(() => { if (playing) spawnRound(); }, ms);
}

function update(dt){
  if (!playing) return;
  const H = track.clientHeight;
  const list = pills.slice();
  for (const p of list){
    if (!p.alive) continue;
    if (p.delay > 0){ p.delay -= dt; continue; }
    p.y += speed * dt;
    p.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
    if (p.y > H){
      p.alive = false;
      p.el.remove();
      if (p.correct) missTarget();
    }
  }
  pills = pills.filter(p => p.alive);
}

function loop(t){
  if (!playing) return;
  const dt = Math.min(0.05, ((t - lastT) / 1000) || 0);
  lastT = t;
  update(dt);
  rafId = requestAnimationFrame(loop);
}

function startGame(){
  score = 0; combo = 0; bestCombo = 0; lives = 3; rounds = 0; speed = 70;
  playing = true; roundActive = false;
  track.querySelectorAll('.pill').forEach(el => el.remove());
  pills = [];
  $('overlay').classList.add('hide');
  updateHud();
  spawnRound();
  lastT = performance.now();
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(loop);
}

function gameOver(){
  if (!playing) return;
  playing = false;
  cancelAnimationFrame(rafId);
  clearPills(false);
  $('target').textContent = '当前目标：—';
  $('ovTitle').textContent = '血量耗尽';
  $('ovDesc').style.display = 'none';
  const st = $('ovStats');
  st.style.display = 'grid';
  st.innerHTML =
    '<div class="stat"><b>分数</b><span>' + score + '</span></div>' +
    '<div class="stat"><b>坚持轮数</b><span>' + rounds + '</span></div>' +
    '<div class="stat"><b>最高连击</b><span>\u00d7' + bestCombo + '</span></div>' +
    '<div class="stat"><b>最终速度</b><span>' + (speed / 70).toFixed(1) + '\u00d7</span></div>';
  $('ovBtn').textContent = '再来一局';
  $('overlay').classList.remove('hide');
  updateHud();
}

$('ovBtn').addEventListener('click', startGame);
updateHud();
</script>
</body>
</html>
