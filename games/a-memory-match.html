<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A · 翻牌配对</title>
<script>
/* 抢在样式生效之前把主题贴到 <html> 上（浅色 / 深色 / 跟随系统 三态），
   晚一步用暗色的人每次进来都会先白闪一下。
   ⚠️ 游戏页是独立页面，不引 assets/js/theme.js，所以这段判定要自带一份；
      存储键与主应用一致（er_theme），旧键 er_games_theme 仍读一次做迁移。 */
(function () {
  var mode = 'light';
  try {
    var v = localStorage.getItem('er_theme') || localStorage.getItem('er_games_theme');
    if (v === 'light' || v === 'dark' || v === 'system') mode = v;
  } catch (e) {}
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function apply() {
    var dark = mode === 'dark' || (mode === 'system' && mq && mq.matches);
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
  }
  apply();
  /* 配色（Day 32）：与主界面共用 er_tint，缺省冷白。
     必须在样式生效前贴好，否则暖白用户会先看到一眼冷白再跳。
     ⚠️ 只认 'warm' 这一个显式值，其余一律冷白 —— 和 assets/js/theme.js 的 readTint() 同一套规矩。 */
  try {
    var tint = localStorage.getItem('er_tint');
    document.documentElement.setAttribute('data-tint', tint === 'warm' ? 'warm' : 'cool');
  } catch (e) {
    document.documentElement.setAttribute('data-tint', 'cool');
  }
  /* 选了「跟随系统」的话，系统配色变了要立刻跟上 */
  if (mq && mode === 'system') {
    var on = function () { apply(); };
    if (mq.addEventListener) mq.addEventListener('change', on);
    else if (mq.addListener) mq.addListener(on);
  }
})();
</script>
<style>
:root{
  /* ---- 浅色模式（默认）：色值对齐主界面 assets/css/style.css ----
     （Day 32）冷白底 #f4f5f7 / 纯白卡片 / 描边 #dfe1e6 / 正文 #16181d / 深绿强调 #0f6e56 / 品牌深蓝 #1a2c73。
     为什么冷白是默认：冷调才配得上品牌深蓝 #1a2c73；暖白那份见下方 html[data-tint="warm"] */
  --bg:#f4f5f7;--card:#ffffff;--card2:#f4f5f7;--line:#dfe1e6;--line-strong:#cfd3da;
  --tx:#16181d;--tx2:#4c545e;--tx3:#606c77;
  --accent:#0f6e56;--accent-strong:#0b5a46;
  --navy:#1a2c73;--navy-bg:#eef1fa;--navy-line:#b9c4dd;--navy-bg-hover:#e4e9f6;
  --back-bg:#eceef1;--back-line:#cfd3da;--back-tx:#1a2c73;
  --ok-bg:#e1f5ee;--ok-line:#0f6e56;--ok-tx:#0b5a46;
  --ok-soft-bg:#eaf3de;--ok-soft-line:#639922;--ok-soft-tx:#3b6d11;
  --ok-key-bg:#639922;--ok-key-tx:#ffffff;
  --bad-bg:#fbeae8;--bad-line:#d92d20;--bad-tx:#b42318;
  --bad-key-bg:#b42318;--bad-key-tx:#ffffff;
  --inset:#eceef1;--hover:#f7f8fa;--lane:rgba(22,24,29,.10);
  --warn:#a86a00;--danger:#d92d20;
  --toast-bg:#ffffff;--scrim:rgba(10,24,20,.42);
  --shadow:0 10px 22px -8px rgba(16,24,40,.16),0 22px 44px -20px rgba(16,24,40,.18);
  /* 站内选浅色就锁浅色：声明 light 后，安卓 Chrome 的「深色强制反色」不会再篡改这页。
     深色主题那一块另行声明 dark。 */
  color-scheme:light;
}

/* ---- 暖色档（Day 32）：与主界面共用 localStorage 的 er_tint ----
   默认冷白；用户在主界面右栏点「配色 · 暖」时，<html> 上才会出现 data-tint="warm"。
   只覆盖中性色，语义色（绿/红/蓝标签）冷暖通用，不动。
   ⚠️ 本块必须排在 html[data-theme="dark"] 之前：两者特异性相同，靠顺序让暗色赢。 */
html[data-tint="warm"]{
  --bg:#f6f2ea;--card:#fffdf8;--card2:#f6f2ea;--line:#e7e0d3;--line-strong:#d8cfbe;
  --back-bg:#f1ecdf;--back-line:#d8cfbe;
  --inset:#f1ecdf;--hover:#f6f1e7;
  --toast-bg:#fffdf8;
}

/* ---- 暗色模式：变量名与浅色一一对应，切主题只换这一块，下面所有规则都不用动 ----
   暗色这一组的取值就是改造前那套原色，切回去和原来长得一样。 */
html[data-theme="dark"]{
  --bg:#131318;--card:#1C1C23;--card2:#232330;
  --line:rgba(255,255,255,.10);--line-strong:rgba(255,255,255,.22);
  --tx:#EDEDF2;--tx2:#A2A2AE;--tx3:#6C6C78;
  --accent:#2258c9;--accent-strong:#2f6ae0;
  --navy:#CECBF6;--navy-bg:#26215C;--navy-line:#534AB7;--navy-bg-hover:#312b7a;
  --back-bg:#26215C;--back-line:#534AB7;--back-tx:#7F77DD;
  --ok-bg:#04342C;--ok-line:#0F6E56;--ok-tx:#9FE1CB;
  --ok-soft-bg:#1B3A16;--ok-soft-line:#639922;--ok-soft-tx:#C0DD97;
  --ok-key-bg:#3B6D11;--ok-key-tx:#EAF3DE;
  --bad-bg:#3D1414;--bad-line:#A32D2D;--bad-tx:#F7C1C1;
  --bad-key-bg:#791F1F;--bad-key-tx:#FCEBEB;
  --inset:#232330;--hover:#2A2A36;--lane:rgba(255,255,255,.07);
  --warn:#EF9F27;--danger:#E24B4A;
  --toast-bg:#232330;--scrim:rgba(10,10,14,.87);
  --shadow:0 18px 40px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center;
  padding:22px 14px 54px;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:420px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.back{font-size:12px;color:var(--tx3);text-decoration:none;transition:.15s}
.back:hover{color:var(--accent)}
.title{font-size:14px;font-weight:500}
.hud{display:flex;gap:8px;margin-bottom:12px}
.metric{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}
.metric b{display:block;font-size:11px;font-weight:400;color:var(--tx2);margin-bottom:3px}
.metric span{font-size:16px;font-weight:500}
#board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cell{position:relative;height:68px;perspective:700px;cursor:pointer}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .34s ease}
.cell.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:12px;font-weight:500;
  padding:4px 5px;text-align:center;line-height:1.28;word-break:break-word}
.face.back{background:var(--back-bg);border:1px solid var(--back-line);color:var(--back-tx);font-size:17px}
.face.front{transform:rotateY(180deg);background:var(--navy-bg);border:1px solid var(--navy-line);color:var(--navy)}
.face.front.zh{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok-tx)}
.cell.done{opacity:.45;cursor:default}
.tip{margin-top:16px;font-size:12px;color:var(--tx3);text-align:center;line-height:1.8}
.overlay{position:fixed;inset:0;background:var(--scrim);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:9}
.overlay.show{display:flex}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;
  width:100%;max-width:322px;text-align:center;box-shadow:var(--shadow)}
.panel h2{font-size:16px;font-weight:500;margin:0 0 18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.stat{background:var(--card2);border-radius:10px;padding:11px 10px}
.stat b{display:block;font-size:11px;font-weight:400;color:var(--tx2);margin-bottom:4px}
.stat span{font-size:17px;font-weight:500}
.btn{width:100%;background:var(--accent);border:none;color:#fff;border-radius:10px;padding:12px;
  font-size:14px;font-family:inherit;cursor:pointer;transition:.15s}
.btn:hover{background:var(--accent-strong)}
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="back" href="../vocab.html">← 返回词汇速记</a>
    <span class="title">A · 翻牌配对</span>
  </header>

  <div class="hud">
    <div class="metric"><b>步数</b><span id="mMoves">0</span></div>
    <div class="metric"><b>配对</b><span id="mPairs">0 / 6</span></div>
    <div class="metric"><b>用时</b><span id="mTime">00:00</span></div>
  </div>

  <div id="board"></div>

  <p class="tip">翻开两张牌，词与义对上即消除<br>每翻两张牌算 1 步，步数越少越准</p>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2 id="ovTitle">全部配对完成</h2>
    <div class="stats" id="ovStats"></div>
    <button class="btn" id="ovBtn">再来一局</button>
  </div>
</div>

<script src="dicts.js"></script>
<script src="dict-pick.js"></script>
<script>
/* 兜底词表：只有在 dicts.js 和 words.js 都读不到时才用，正常情况请忽略它 */
const FALLBACK_WORDS = [
  {en:'resilient', zh:'坚韧的；有弹性的',   pos:'adj.', ph:'/r\u026a\u02c8z\u026ali\u0259nt/'},
  {en:'courage',   zh:'勇气',              pos:'n.',   ph:'/\u02c8k\u028cr\u026ad\u0292/'},
  {en:'hesitate',  zh:'犹豫，踌躇',         pos:'v.',   ph:'/\u02c8hez\u026ate\u026at/'},
  {en:'generous',  zh:'慷慨的，大方的',     pos:'adj.', ph:'/\u02c8d\u0292en\u0259r\u0259s/'},
  {en:'ambiguous', zh:'模棱两可的',         pos:'adj.', ph:'/\u00e6m\u02c8b\u026a\u0261ju\u0259s/'},
  {en:'vague',     zh:'含糊不清的',         pos:'adj.', ph:'/ve\u026a\u0261/'},
  {en:'persist',   zh:'坚持，持续',         pos:'v.',   ph:'/p\u0259\u02c8s\u026ast/'},
  {en:'reluctant', zh:'不情愿的',           pos:'adj.', ph:'/r\u026a\u02c8l\u028ckt\u0259nt/'},
  {en:'diligent',  zh:'勤勉的',             pos:'adj.', ph:'/\u02c8d\u026al\u026ad\u0292\u0259nt/'},
  {en:'fragile',   zh:'易碎的，脆弱的',     pos:'adj.', ph:'/\u02c8fr\u00e6d\u0292a\u026al/'},
  {en:'genuine',   zh:'真正的，真诚的',     pos:'adj.', ph:'/\u02c8d\u0292enju\u026an/'},
  {en:'abundant',  zh:'丰富的，充裕的',     pos:'adj.', ph:'/\u0259\u02c8b\u028cnd\u0259nt/'},
  {en:'tolerate',  zh:'容忍，忍受',         pos:'v.',   ph:'/\u02c8t\u0252l\u0259re\u026at/'},
  {en:'accurate',  zh:'准确的',             pos:'adj.', ph:'/\u02c8\u00e6kj\u0259r\u0259t/'},
  {en:'sincere',   zh:'真诚的',             pos:'adj.', ph:'/s\u026an\u02c8s\u026a\u0259/'},
  {en:'obstacle',  zh:'障碍，阻碍',         pos:'n.',   ph:'/\u02c8\u0252bst\u0259kl/'},
  {en:'thrive',    zh:'茁壮成长，兴旺',     pos:'v.',   ph:'/\u03b8ra\u026av/'},
  {en:'frequent',  zh:'频繁的',             pos:'adj.', ph:'/\u02c8fri\u02d0kw\u0259nt/'},
  {en:'modest',    zh:'谦虚的；适度的',     pos:'adj.', ph:'/\u02c8m\u0252d\u026ast/'},
  {en:'anxious',   zh:'焦虑的；渴望的',     pos:'adj.', ph:'/\u02c8\u00e6\u014bk\u0283\u0259s/'}
];

/* 优先读外部词库 words.js；读不到才回退到上面的兜底词表。
   顺带过滤掉翻牌格子里放不下的词（非纯字母、过长）。 */
const WORDS = ((window.PICKED_WORDS && window.PICKED_WORDS.length) ? window.PICKED_WORDS : FALLBACK_WORDS)
  .filter(w => /^[a-z]+$/.test(w.en) && w.en.length >= 3 && w.en.length <= 12);

const PAIRS = 6;
const board = document.getElementById('board');
let deck = [], flipped = [], matched = 0, moves = 0;
let seconds = 0, timerId = null, lock = false, started = false;

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmt(s){
  const m = String(Math.floor(s / 60)).padStart(2, '0');
  const x = String(s % 60).padStart(2, '0');
  return m + ':' + x;
}

function newGame(){
  clearInterval(timerId); timerId = null;
  seconds = 0; moves = 0; matched = 0; flipped = []; lock = false; started = false;
  document.getElementById('mMoves').textContent = '0';
  document.getElementById('mPairs').textContent = '0 / ' + PAIRS;
  document.getElementById('mTime').textContent = '00:00';
  document.getElementById('overlay').classList.remove('show');

  const pick = shuffle(WORDS).slice(0, PAIRS);
  deck = [];
  pick.forEach((w, i) => {
    deck.push({pid: i, type: 'en', text: w.en});
    deck.push({pid: i, type: 'zh', text: w.zh});
  });
  deck = shuffle(deck);

  board.innerHTML = '';
  deck.forEach((c, idx) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const front = document.createElement('div');
    front.className = 'face front' + (c.type === 'zh' ? ' zh' : '');
    front.textContent = c.text;
    const back = document.createElement('div');
    back.className = 'face back';
    back.textContent = '\u25c6';
    const inner = document.createElement('div');
    inner.className = 'inner';
    inner.appendChild(back);
    inner.appendChild(front);
    cell.appendChild(inner);
    cell.addEventListener('click', () => onFlip(idx, cell));
    board.appendChild(cell);
  });
}

function startTimer(){
  if (started) return;
  started = true;
  timerId = setInterval(() => {
    seconds++;
    document.getElementById('mTime').textContent = fmt(seconds);
  }, 1000);
}

function onFlip(idx, cell){
  if (lock || cell.classList.contains('flip') || cell.classList.contains('done')) return;
  startTimer();
  cell.classList.add('flip');
  flipped.push({idx, cell});

  if (flipped.length < 2) return;

  moves++;
  document.getElementById('mMoves').textContent = moves;
  const [a, b] = flipped;

  if (deck[a.idx].pid === deck[b.idx].pid){
    a.cell.classList.add('done');
    b.cell.classList.add('done');
    matched++;
    document.getElementById('mPairs').textContent = matched + ' / ' + PAIRS;
    flipped = [];
    if (matched === PAIRS) win();
  } else {
    lock = true;
    setTimeout(() => {
      a.cell.classList.remove('flip');
      b.cell.classList.remove('flip');
      flipped = [];
      lock = false;
    }, 660);
  }
}

function win(){
  clearInterval(timerId); timerId = null;
  const acc = Math.round(PAIRS / Math.max(moves, 1) * 100);
  document.getElementById('ovTitle').textContent = '全部配对完成';
  document.getElementById('ovStats').innerHTML =
    '<div class="stat"><b>用时</b><span>' + fmt(seconds) + '</span></div>' +
    '<div class="stat"><b>步数</b><span>' + moves + '</span></div>' +
    '<div class="stat"><b>配对数</b><span>' + PAIRS + ' / ' + PAIRS + '</span></div>' +
    '<div class="stat"><b>准确率</b><span>' + acc + '%</span></div>';
  document.getElementById('overlay').classList.add('show');
}

document.getElementById('ovBtn').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
