<!DOCTYPE html>

  <meta charset="UTF-8">
  <script>
  /* ER_RETRY_V1 —— 资源加载兜底（P0-4：平台偶发对已存在的文件回 404）
     ① 为什么内联、不放进独立 .js：兜底脚本自己也会被 404，独立文件等于没兜底。
     ② 为什么串行排队：login.js 依赖 common.js 的 escapeHTML、page-loader.js 的 PageLoader，
        并行重试会打乱执行顺序，比不兜底更糟。
     ③ 为什么最多 2 次：再失败就是真没了，继续重试只是把抖动放大成刷请求。
     ④ 只兜 <script> 与 <link rel=stylesheet>；图片裂了不影响功能，不重试。
     ⑤ 位置必须在 <meta charset> 之后：本片段约 2.2KB，放前面会把字符集声明顶出前 1024 字节，
        浏览器改用别的编码 → 中文乱码。 */
  (function () {
    var MAX = 2, queue = [], running = false;
    function urlOf(el) { return el.tagName === 'LINK' ? el.href : el.src; }
    function enqueue(el) {
      var n = +(el.getAttribute('data-er-retry') || 0);
      if (n >= MAX) return;
      el.setAttribute('data-er-retry', n + 1);
      if (queue.indexOf(el) < 0) queue.push(el);
      drain();
    }
    function drain() {
      if (running || !queue.length) return;
      running = true;
      var el = queue.shift();
      var n = +el.getAttribute('data-er-retry');
      var base = urlOf(el).split(/[?&]er_retry=/)[0].replace(/[?&]$/, '');
      var sep = base.indexOf('?') > -1 ? '&' : '?';
      var node;
      if (el.tagName === 'LINK') {
        node = document.createElement('link');
        node.rel = 'stylesheet';
        node.href = base + sep + 'er_retry=' + n + '_' + Date.now();
      } else {
        node = document.createElement('script');
        node.src = base + sep + 'er_retry=' + n + '_' + Date.now();
        node.async = false;
      }
      node.setAttribute('data-er-generated', '1');
      node.onload = function () { running = false; drain(); };
      node.onerror = function () { running = false; enqueue(el); drain(); };
      (document.head || document.documentElement).appendChild(node);
    }
    document.addEventListener('error', function (e) {
      var t = e.target;
      if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
      if (!urlOf(t)) return;
      if (t.hasAttribute('data-er-generated')) return;
      enqueue(t);
    }, true);
  })();
  </script>

  <script>
  (function () {
    var URL_DATA = 'data/freetalk.json';
    var KEY_DRAFT = 'freetalk_draft';   // { 话题id: 用户回答 }
    var KEY_DONE  = 'freetalk_done';    // [ 话题id ]
    var KEY_CAT   = 'freetalk_cat';     // 当前分类 id

    var $ = function (id) { return document.getElementById(id); };
    var statusBox = $('ft-status'), mainBox = $('ft-main');

    var CATS = [], TOPICS = [], CUR_CAT = 'all', CUR = null;

    /* ---------- 给「AI 对话」板块留的出口（Day 32 改写） ----------
       Day 29 这里挂的是一座 window.FreeTalkBridge，让语音区知道"现在哪道题"。
       语音区已经搬到 talk.html 独立成页，那座桥连同它的订阅者一起没了用 ——
       桥留着只会让人以为"还有人在用"，所以拆干净。
       现在只需要一件事：把「哪道题 + 写了什么」交给浏览器，跳过去。 */
    var KEY_SEED = 'talk_seed';   /* 跟 talk.js 里的 K_SEED 是同一个键，改一处必须两处都改 */

    function readJSON(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
    function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function spkSvg() {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" ' +
        'stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 8.5H3.5v7h3L11 19V5Z"/>' +
        '<path d="M15 9.5a3.5 3.5 0 0 1 0 5"/><path d="M17.5 7a7 7 0 0 1 0 10"/></svg>';
    }
    /* 参考词汇发音走有道标准美音（type=2）。全球发音需要先离线预取 voiceId，
       本页词汇没做预取，所以只给标准音，不放点不响的假按钮。 */
    window.ftPlay = function (w) {
      new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(w) + '&type=2').play();
    };

    /* ---------- 左栏分类 ---------- */
    function renderCats() {
      var box = $('catList'), done = readJSON(KEY_DONE, []);
      box.innerHTML = '';
      CATS.forEach(function (c) {
        var inCat = c.id === 'all' ? TOPICS : TOPICS.filter(function (t) { return t.cat === c.id; });
        var dn = inCat.filter(function (t) { return done.indexOf(t.id) >= 0; }).length;
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'level-btn';
        b.setAttribute('data-cat', c.id);
        b.setAttribute('aria-pressed', String(c.id === CUR_CAT));
        var row = document.createElement('span'); row.className = 'ft-cat-row';
        var nm = document.createElement('span'); nm.textContent = c.name;
        var ct = document.createElement('span'); ct.className = 'c'; ct.textContent = dn + '/' + inCat.length;
        row.appendChild(nm); row.appendChild(ct); b.appendChild(row);
        b.addEventListener('click', function () {
          if (CUR_CAT === c.id) return;
          CUR_CAT = c.id; writeJSON(KEY_CAT, c.id);
          renderCats(); pick(pool()[0]);
        });
        box.appendChild(b);
      });

      /* 弹簧动效（Day 31）：与 index.html 的 Lesson 列表同一套收养模式。
         ⚠️ 只加"动"，.level-btn 的皮原样；切分类会重渲染本列表，
            组件内部自己清理旧实例，这里放心每次都调。 */
      if (window.AnimatedList && typeof AnimatedList.enhance === 'function') {
        AnimatedList.enhance(box, { selectOnHover: false, enableArrowNavigation: false });
      }

      /* 分类列表就绪：左栏淡入（加载期整个侧栏不显示）。
         撤类统一走 revealSide() —— 它同时被"题库读取失败 / 题库为空 / 全局未捕获错误"
         三条兜底路径调用，别在这里另写一份。 */
      revealSide();
    }

    function pool() {
      return CUR_CAT === 'all' ? TOPICS : TOPICS.filter(function (t) { return t.cat === CUR_CAT; });
    }

    /* ---------- 渲染当前话题 ---------- */
    function pick(t) {
      if (!t) {
        mainBox.hidden = true;
        statusBox.innerHTML = '<div class="ft-empty">这个分类下暂时没有话题</div>';
        return;
      }
      CUR = t;
      mainBox.hidden = false;
      statusBox.innerHTML = '';

      var catName = (CATS.filter(function (c) { return c.id === t.cat; })[0] || {}).name || t.cat;
      var list = pool();
      $('ftPart').textContent = t.part;
      $('ftCat').textContent = catName;
      $('ftLevel').textContent = t.level;
      $('ftQ').textContent = t.q;
      $('ftZh').textContent = t.zh;

      if (t.bullets && t.bullets.length) {
        $('ftBul').hidden = false;
        $('ftBul').innerHTML = t.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('');
      } else {
        $('ftBul').hidden = true; $('ftBul').innerHTML = '';
      }

      $('ftFollow').innerHTML = (t.follow || []).map(function (f) {
        return '<div class="ft-follow">' + esc(f) + '</div>';
      }).join('');
      $('ftFollowN').textContent = (t.follow || []).length + ' 条 · 第 ' +
        (list.indexOf(t) + 1) + '/' + list.length + ' 题';

      $('ftWords').innerHTML = (t.words || []).map(function (w) {
        return '<span class="ft-w" onclick="ftPlay(\'' + esc(w) + '\')">' + spkSvg() + esc(w) + '</span>';
      }).join('');
      $('ftTips').textContent = t.tips || '';
      $('ftSample').textContent = t.sample || '';

      // 星一班表达溯源：src = [[表达, 编号, 起始秒, 结束秒], ...]，点击跳转到文本跟读页定位该句
      var srcBox = $('ftSrc'), srcList = $('ftSrcList');
      if (t.src && t.src.length) {
        srcBox.hidden = false;
        srcList.innerHTML = t.src.map(function (s) {
          return '<span class="ft-src-item" data-ref="' + esc(s[1]) + '"' +
            ' data-s="' + (s[2] || 0) + '">' +
            '<b>' + esc(s[0]) + '</b><em>' + esc(s[1]) + '</em>' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
            ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>' +
            '</span>';
        }).join('');
      } else {
        srcBox.hidden = true;
        srcList.innerHTML = '';
      }

      $('secSample').classList.remove('open');

      var draft = readJSON(KEY_DRAFT, {});
      $('ftAns').value = draft[t.id] || '';
      countWords();
      syncDone();

      /* 弹簧动效（Day 31）：主区 5 个板块（话题卡/作答框/追问/参考词汇/参考回答）
         逐块弹入 —— 进页、切分类、换一个话题都走 pick()，每次都有切换动效。
         板块自带 margin-top:14px 间距，gap 传 0 原版式不动；皮肤全保留
         （折叠/输入框/按钮照常工作，组件只是包一层壳加入场动画） */
      if (window.AnimatedList && typeof AnimatedList.enhance === 'function') {
        AnimatedList.enhance(mainBox, { rowSelector: 'section', selectOnHover: false,
          enableArrowNavigation: false, gap: 0, viewportPadding: 0, radius: 16,
          scrollable: false });
      }
    }

    function countWords() {
      var v = $('ftAns').value.trim();
      var n = v ? v.split(/\s+/).length : 0;
      $('ftCount').innerHTML = '<b>' + n + '</b> 词' + (n < 40 ? ' · 建议写到 40 词以上' : '');
    }

    function syncDone() {
      if (!CUR) return;
      var done = readJSON(KEY_DONE, []);
      var b = $('ftDone'), on = done.indexOf(CUR.id) >= 0;
      b.textContent = on ? '已练 ✓' : '标记已练';
      b.classList.toggle('done', on);
    }

    /* ---------- 事件 ---------- */
    $('ftAns').addEventListener('input', function () {
      countWords();
      if (!CUR) return;
      var d = readJSON(KEY_DRAFT, {});
      d[CUR.id] = $('ftAns').value;
      writeJSON(KEY_DRAFT, d);
    });

    $('ftChange').addEventListener('click', function () {
      var list = pool();
      if (list.length < 2) return;
      var next;
      do { next = list[Math.floor(Math.random() * list.length)]; } while (next.id === CUR.id);
      pick(next);
    });

    $('ftDone').addEventListener('click', function () {
      if (!CUR) return;
      var done = readJSON(KEY_DONE, []);
      var i = done.indexOf(CUR.id);
      if (i >= 0) done.splice(i, 1); else done.push(CUR.id);
      writeJSON(KEY_DONE, done);
      syncDone(); renderCats();
    });

    /* Day 32：去「AI 对话」接着说。
       ⚠️ 只存草稿 + 跳转，【不发任何 AI 请求】——
          这一页已经没有 AI 逻辑了，批改应该发生在"真的说了一句"之后。
       ⚠️ 话题 id 同时走 URL（?topic=）和 localStorage：
          URL 让这一跳可分享、可回退，localStorage 兜住"直接打开 talk.html"的情况。 */
    $('ftGoTalk').addEventListener('click', function () {
      if (!CUR) return;
      var text = $('ftAns').value.trim();
      try {
        localStorage.setItem(KEY_SEED, JSON.stringify({
          topicId: CUR.id, text: text, ts: Date.now()
        }));
      } catch (e) {}
      window.location.href = 'talk.html?topic=' + encodeURIComponent(CUR.id);
    });

    Array.prototype.forEach.call(document.querySelectorAll('.ft-h[data-toggle]'), function (h) {
      h.addEventListener('click', function () {
        $(h.getAttribute('data-toggle')).classList.toggle('open');
      });
    });

    /* ---------- 星一班跳转：点绿字 → 文本跟读页定位到该句（停止状态） ---------- */
    $('ftSrcList').addEventListener('click', function (ev) {
      var chip = ev.target.closest ? ev.target.closest('.ft-src-item') : null;
      if (!chip) return;
      var ref = chip.getAttribute('data-ref');
      var s = chip.getAttribute('data-s');
      if (!ref) return;
      window.location.href = 'index.html?file=' + encodeURIComponent(ref) +
        (s ? '&t=' + encodeURIComponent(s) : '');
    });

    /* ---------- 载入数据 ---------- */
    /* 左栏 side-loading 的统一撤销点。
       原先只在 renderCats() 里撤 —— 而 renderCats() 只有"成功拿到题库"这一条路会调到，
       请求失败 / 题库为空 / 字段残缺时左栏会永久停在 opacity:0（实测三种情况全中）。
       所以抽出来，三条路都调；classList.remove 幂等，多调无害。 */
    function revealSide() {
      var sl = document.querySelector('.side--left');
      if (sl) sl.classList.remove('side-loading');
    }

    function load() {
      statusBox.innerHTML = '<div class="ft-empty">正在载入话题…</div>';
      fetch(URL_DATA, { cache: 'no-cache' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function (d) {
          TOPICS = d.topics || [];
          CATS = d.cats || [];
          if (!TOPICS.length) {
            statusBox.innerHTML = '<div class="ft-empty">题库是空的</div>';
            revealSide();   /* 没有话题也要放左栏，否则用户面对一片空白无从下手 */
            return;
          }
          var saved = readJSON(KEY_CAT, 'all');
          if (CATS.some(function (c) { return c.id === saved; })) CUR_CAT = saved;
          renderCats();
          pick(pool()[0]);
        })
        .catch(function (e) {
          statusBox.innerHTML = '<div class="ft-empty">题库读取失败（' + esc(e.message) +
            '）<br><button type="button" class="ft-btn" id="ftRetry" style="margin-top:10px">重试</button></div>';
          revealSide();   /* 失败也要放左栏：用户至少能用"重试"，而不是面对一片空白 */
          var r = $('ftRetry');
          if (r) r.addEventListener('click', load);
        });
    }

    /* 兜底：初始化途中任何未捕获错误都会让上面的失败分支都跑不到（连 load() 都可能没执行），
       左栏就永久停在 opacity:0。这里用全局 error 事件兜一次。
       ⚠️ 不加 capture，所以只接运行时错误，不接图片/脚本加载失败那种 resource error。 */
    window.addEventListener('error', revealSide);

    load();
  })();
  </script>

  <!-- ⚠️ Day 32：freetalk-ai.js 已随语音区一起迁到 talk.html（assets/js/talk.js）。
       这里再引一次就是两套录音逻辑并行 —— 本页没有对应的 DOM，它自己会静默不启动，
       但留着一个"看起来还在跑"的文件，下次改逻辑时一定会有人改错那一份。 -->
</body>
</html>
