<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ============================================
       ⚠️ 这个文件已经不是页面了，只剩一个「跳转」的作用。
       ------------------------------------------------------------
       背景（2026-10-13，首页取消那天）：
         原来的 index.html 是「三张板块卡片」的入口页，谁也不会盯着它看，
         所以把跟读页整个搬进了 index.html —— 静态托管只认 index.html 当根路径，
         这样「打开网址直接进文本跟读」才成立。
         reader.html 这个文件名在文档（RUN.md / api-contract.md）和老书签里出现过，
         直接删掉的话，谁还用老地址进来就是 404。
         所以留了这一页：进来就立刻跳到 index.html。

       ⚠️ 什么时候可以删：确认站内 / 文档 / 书签里没人再引用 reader.html，
          就整个删掉。它不再承载任何功能。

       为什么用 meta refresh 不用 JS 跳转：
         JS 没跑起来（被拦、报错）时 meta refresh 照样跳，不依赖任何脚本。
         content="0" 是「0 秒后跳」，用户基本无感。
       ============================================ -->
  <meta http-equiv="refresh" content="0; url=index.html">
  <meta name="robots" content="noindex">
  <title>已搬到首页 · 星禾星穗</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- meta refresh 失效时的兜底（比如个别浏览器禁了自动跳转）：给一条人话和一个手动的门 -->
  <main>
    <p>文本跟读已经搬到<a href="index.html">首页</a>，点一下就过去。</p>
  </main>
</body>
</html>
