<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- ⚠️ 跨页过渡的 opt-in，【必须】留在这里，不要挪进 assets/css/style.css：
       Chrome 做这项检查时不保证等外部样式表解析完，而这条规则原先在 style.css
       的 1800 行之后 —— 实测 6 次跳转只有 1~2 次生效，时好时坏。
       挪到 <head> 靠前的位置之后 6/6 稳定。详见 style.css 里同名注释。
       跟读页（reader.html）里有一份同样的，两页都声明才生效。 -->
  <style>@view-transition { navigation: auto; }</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英语学习工具 · 首页</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- 加载遮罩的样式。单独一个文件、且排在 style.css 之后：
       一是这块随时能整包撤掉，二是万一将来有同名类，后引的能压住前者。
       类名统一 ld- 前缀，已核实不与 style.css 里任何类重名。 -->
  <link rel="stylesheet" href="assets/css/loading.css">
</head>
<body>
  <!-- 【加载遮罩】data/boards.json 读到之前，页面上什么都没有（见 home.js 里
       「加载中必须说话」那条注释）。这一层先用 logo 动画顶上，数据回来或读取失败
       再由 home.js 淡出移除。
       aria-hidden="true"：遮罩里的「加载中」不参与朗读 —— 那句话已由
       #boards-status（role="status"）负责播报，两边都念会重复一遍。
       四片用 <div> 而非 <img>：动画靠 background-image，切图路径写在 loading.css 里。 -->
  <div class="ld-mask" id="ld-mask" aria-hidden="true">
    <div class="ld-inner">
      <div class="ld-logo">
        <div class="ld-petal ld-petal--tl"></div>
        <div class="ld-petal ld-petal--bl"></div>
        <div class="ld-petal ld-petal--br"></div>
        <div class="ld-rotor"><div class="ld-petal ld-petal--tr"></div></div>
      </div>
      <p class="ld-label">加载中</p>
      <div class="ld-track"><div class="ld-fill"></div></div>
    </div>
  </div>

  <script>
  /* 【兜底】万一 home.js 没跑起来（语法报错、文件 404、被拦），8 秒后强制撤掉遮罩。
     宁可看不到加载动画，也绝不能把整个页面永久挡住 —— 挡死了这一页就废了。
     注意：这是安全网，正常路径由 home.js 接管，通常几百毫秒内就撤了。 */
  setTimeout(function () {
    var m = document.getElementById('ld-mask');
    if (m && !m.classList.contains('is-gone')) {
      m.classList.add('is-hide');
      setTimeout(function () { m.classList.add('is-gone'); }, 350);
    }
  }, 8000);
  </script>

  <!-- 顶部标题 = 站名；下面三张卡片就是「三个子标题」，桌面三栏并排、窄屏纵向堆叠 -->
  <header class="site-header">
    <!-- 品牌区：logo + 站名。
         ⚠️ 这四个字用的**不是系统字体**，而是【从原创 logo 图里取出来的字形本身】。
            理由：图里那种「方块几何黑」系统里根本没有；就算找个近似的替代，
            也等于把品牌字改掉了，而且这是个公开站点 —— 别人的设备上没装那字体，
            会掉回默认字体，等于白设。所以直接拿字形图来用，任何设备上长得都一样。
         实现：四个空 span，各自拿同一张字形图当蒙版（mask）开了四扇「窗」。
            为什么要开窗而不是把图切成四块：开窗时四个字共享同一张图，
            笔画天然连续、绝不会在接缝处断开，但每扇窗又能各自单独做动效。
         无障碍：外层 role="img" ＋ aria-label 提供名称，
            四个空 span 不参与朗读（它们本来就没文字）。 -->
    <div class="brand">
      <img class="brand-logo" src="assets/img/logo.png" alt="" width="40" height="40">
      <span class="brand-name" role="img" aria-label="星禾星穗">
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
        <span class="brand-char" aria-hidden="true"></span>
      </span>
    </div>
    <h1>英语学习工具</h1>
  </header>

  <main>
    <!-- 状态位：加载中 / 暂无板块 / 读取失败＋重试，都写在这一个地方。
         role="status" 是给读屏软件的：内容一变它就会念出来，不用用户自己去发现。
         正常有数据时它是空的，不占版面 -->
    <div id="boards-status" role="status"></div>

    <!-- 板块卡片由 assets/js/home.js 读 data/boards.json 渲染。
         Day 8 之前这三张卡是【写死在这个文件里】的，现在改成数据驱动：
         改标题、改说明、加第四个板块，都只改 JSON，这个文件不用动 -->
    <ul class="boards" id="boards"></ul>
  </main>

  <!-- Day 26：版本标记。
       ⚠️ 它不是装饰，是"发布 → 回滚 → 恢复"这条链上唯一一处
          【肉眼和 curl 都能一眼看出线上是哪一版】的东西。
          没有它，"退回上一版"这一步在截图里根本看不出差别，
          回滚演练就没法客观证明 —— 别顺手删掉。 -->
  <footer class="site-foot">v1.0</footer>

  <!-- Day 23：先引 common.js（提供 loadJSON / failureHTML / escapeHTML），
       再引 home.js —— home.js 已改为引用共用版，顺序反了会报未定义。 -->
  <script src="assets/js/common.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
